<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진정보 수정</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --text:#1b2430; --muted:#6b7684; --line:#dfe3e8;
    --primary:#1f6feb; --primary-text:#fff; --ok:#1a7f37; --warn:#b54708; --err:#c62828;
    --chip:#eef2f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111418; --card:#1b2026; --text:#e7ebf0; --muted:#98a2ae; --line:#2c333b;
      --primary:#4c8dff; --primary-text:#fff; --ok:#3fb950; --warn:#e3a33b; --err:#f27474;
      --chip:#252b33;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.5}
  header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
  header h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  main{max-width:640px;margin:0 auto;padding:8px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
  .card h2{margin:0 0 10px;font-size:15px}
  .step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
    background:var(--primary);color:var(--primary-text);font-size:12px;margin-right:6px}
  label.field{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=date],input[type=time],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
  .row{display:flex;gap:8px;align-items:center}
  .row > *{flex:1;min-width:0}
  .row .tilde{flex:0 0 auto;color:var(--muted)}
  button{font:inherit;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
  .btn{background:var(--primary);color:var(--primary-text);font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-sub{background:var(--chip);color:var(--text)}
  .btn-full{width:100%;margin-top:14px}
  .small-btn{padding:6px 10px;font-size:13px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .pick{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
  .pick input{display:none}
  .list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
  .item img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--chip)}
  .item .meta{flex:1;min-width:0;font-size:12.5px}
  .item .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .old{color:var(--muted)}
  .item .new{color:var(--ok);font-weight:600}
  .item .bad{color:var(--err)}
  .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:12px}
  .status{font-size:13px;margin-top:8px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.warn{color:var(--warn)}
  .check{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13.5px}
  .check input{margin-top:3px;width:18px;height:18px}
  .rule{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}
  .rule b{color:var(--text)}
  a{color:var(--primary)}
  .actions{display:flex;gap:8px;margin-top:12px}
  .actions button{flex:1}
</style>
</head>
<body>
<header>
  <h1>📷 사진정보 수정</h1>
  <p>촬영 날짜·시간·장소를 수정하거나 삭제합니다. 사진은 서버로 전송되지 않습니다.</p>
</header>
<main>

  <section class="card">
    <h2><span class="step">1</span>사진 선택</h2>
    <label class="pick">
      <input id="files" type="file" accept="image/jpeg" multiple>
      <span id="pickText">여기를 눌러 사진 선택 (JPG, 여러 장 가능)</span>
    </label>
    <div class="hint">기존 촬영시간 순서대로 정렬되며, 새 시간도 이 순서대로 부여됩니다.</div>
    <div id="list" class="list"></div>
  </section>

  <section class="card">
    <h2><span class="step">2</span>날짜·시간</h2>
    <label class="field" for="date">날짜</label>
    <input id="date" type="date">
    <label class="field">시간 구간</label>
    <div class="row">
      <input id="tStart" type="time">
      <span class="tilde">~</span>
      <input id="tEnd" type="time">
    </div>
    <div class="hint">구간 안에서 사진마다 임의 시간(초 단위)이 부여됩니다. 날짜를 비우면 촬영일시가 삭제됩니다.</div>
  </section>

  <section class="card">
    <h2><span class="step">3</span>장소</h2>
    <label class="field" for="addr">주소</label>
    <div class="row">
      <input id="addr" type="text" placeholder="예) 당진시 합덕읍 운산리 123" style="flex:3">
      <button id="btnGeo" class="btn-sub" style="flex:1">위치 확인</button>
    </div>
    <div id="geoStatus" class="status"></div>
    <div class="hint">주소를 비우면 위치정보(GPS)가 삭제됩니다.</div>

    <label class="check">
      <input id="stripAll" type="checkbox">
      <span>모든 메타데이터 제거<br><span class="hint" style="margin:0">카메라 기종 등 나머지 정보까지 모두 지웁니다. 위 입력값이 있으면 그것만 새로 넣습니다.</span></span>
    </label>

    <div class="rule">
      <b>적용 규칙</b> · 날짜 입력 → 구간 내 랜덤 시간 부여 / 날짜 빈칸 → 시간 삭제<br>
      주소 입력 → 해당 위치로 변경 / 주소 빈칸 → 위치 삭제
    </div>

    <button id="btnApply" class="btn btn-full" disabled>적용하기</button>
    <div id="applyStatus" class="status"></div>
    <div class="actions" id="saveBox" style="display:none">
      <button id="btnSave" class="btn">전체 저장</button>
      <button id="btnShare" class="btn-sub">공유</button>
    </div>
  </section>

</main>

<script id="core">
/* ===== 카카오 JavaScript 키를 여기에 붙여넣으세요 ===== */
const KAKAO_JS_KEY = '27679d6ac02778e1d0fc989848fab9ca';
/* ===================================================== */

function pad(n){ return String(n).padStart(2,'0'); }

// 십진 좌표 → EXIF 도·분·초 (초는 1/100 단위)
function toDms(deg){
  let total = Math.round(Math.abs(deg) * 360000);   // 1/100초 단위
  const d = Math.floor(total / 360000); total -= d * 360000;
  const m = Math.floor(total / 6000);   total -= m * 6000;
  return [[d,1],[m,1],[total,100]];
}

// "HH:MM" → 초
function toSec(hm){ const [h,m] = hm.split(':').map(Number); return h*3600 + m*60; }

// 날짜(YYYY-MM-DD), 구간 → 정렬된 EXIF 시간 문자열 n개
function randomExifTimes(date, start, end, n){
  const s = toSec(start), e = toSec(end);
  const secs = [];
  for (let i=0;i<n;i++) secs.push(s + Math.floor(Math.random() * (e - s + 1)));
  secs.sort((a,b)=>a-b);
  const d = date.replace(/-/g, ':');
  return secs.map(t => `${d} ${pad(Math.floor(t/3600))}:${pad(Math.floor(t%3600/60))}:${pad(t%60)}`);
}

// 기존 EXIF 읽기 (실패해도 빈 구조 반환)
function loadExif(bin){
  try { return piexif.load(bin); }
  catch(e){ return {'0th':{}, Exif:{}, GPS:{}, Interop:{}, '1st':{}, thumbnail:null}; }
}

function readInfo(exif){
  const dt = exif.Exif[piexif.ExifIFD.DateTimeOriginal] || exif['0th'][piexif.ImageIFD.DateTime] || '';
  const g = exif.GPS || {};
  let gps = '';
  if (g[piexif.GPSIFD.GPSLatitude] && g[piexif.GPSIFD.GPSLongitude]) {
    try {
      let lat = piexif.GPSHelper.dmsRationalToDeg(g[piexif.GPSIFD.GPSLatitude], g[piexif.GPSIFD.GPSLatitudeRef] || 'N');
      let lng = piexif.GPSHelper.dmsRationalToDeg(g[piexif.GPSIFD.GPSLongitude], g[piexif.GPSIFD.GPSLongitudeRef] || 'E');
      gps = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    } catch(e){}
  }
  return { dt, gps };
}

const DATE_TAGS_EXIF = ['DateTimeOriginal','DateTimeDigitized','OffsetTime','OffsetTimeOriginal','OffsetTimeDigitized',
                        'SubSecTime','SubSecTimeOriginal','SubSecTimeDigitized'];

// 한 장 처리: bin(바이너리 문자열 또는 dataURL) → 새 바이너리 문자열
function applyToImage(bin, opt){
  // opt: { time: 'YYYY:MM:DD HH:MM:SS' | null, coord: {lat,lng} | null, stripAll: bool }
  const src = loadExif(bin);
  let exif;
  if (opt.stripAll) {
    exif = {'0th':{}, Exif:{}, GPS:{}, Interop:{}, '1st':{}, thumbnail:null};
    const ori = src['0th'][piexif.ImageIFD.Orientation];
    if (ori) exif['0th'][piexif.ImageIFD.Orientation] = ori; // 사진 회전 방향은 유지
  } else {
    exif = src;
    // 덤프 실패 원인이 잦은 제조사 영역 제거
    delete exif.Exif[piexif.ExifIFD.MakerNote];
  }

  // 날짜·시간
  DATE_TAGS_EXIF.forEach(k => { if (piexif.ExifIFD[k] !== undefined) delete exif.Exif[piexif.ExifIFD[k]]; });
  delete exif['0th'][piexif.ImageIFD.DateTime];
  if (opt.time) {
    exif.Exif[piexif.ExifIFD.DateTimeOriginal]  = opt.time;
    exif.Exif[piexif.ExifIFD.DateTimeDigitized] = opt.time;
    exif['0th'][piexif.ImageIFD.DateTime]       = opt.time;
    if (piexif.ExifIFD.OffsetTimeOriginal !== undefined) {
      exif.Exif[piexif.ExifIFD.OffsetTime] = '+09:00';
      exif.Exif[piexif.ExifIFD.OffsetTimeOriginal] = '+09:00';
      exif.Exif[piexif.ExifIFD.OffsetTimeDigitized] = '+09:00';
    }
  }

  // 위치
  exif.GPS = {};
  delete exif['0th'][piexif.ImageIFD.GPSTag];
  if (opt.coord) {
    const { lat, lng } = opt.coord;
    exif.GPS[piexif.GPSIFD.GPSVersionID]    = [2,3,0,0];
    exif.GPS[piexif.GPSIFD.GPSLatitudeRef]  = lat >= 0 ? 'N' : 'S';
    exif.GPS[piexif.GPSIFD.GPSLatitude]     = toDms(lat);
    exif.GPS[piexif.GPSIFD.GPSLongitudeRef] = lng >= 0 ? 'E' : 'W';
    exif.GPS[piexif.GPSIFD.GPSLongitude]    = toDms(lng);
  }

  let bytes;
  try {
    bytes = piexif.dump(exif);
  } catch(e) {
    // 원본 태그 중 기록 불가한 값이 있으면 핵심 정보만 남기고 다시 시도
    const keep = {'0th':{}, Exif:{}, GPS:exif.GPS, Interop:{}, '1st':{}, thumbnail:null};
    ['Make','Model','Orientation','DateTime'].forEach(k=>{
      const t = piexif.ImageIFD[k]; if (exif['0th'][t] !== undefined) keep['0th'][t] = exif['0th'][t];
    });
    ['DateTimeOriginal','DateTimeDigitized','OffsetTime','OffsetTimeOriginal','OffsetTimeDigitized'].forEach(k=>{
      const t = piexif.ExifIFD[k]; if (t !== undefined && exif.Exif[t] !== undefined) keep.Exif[t] = exif.Exif[t];
    });
    bytes = piexif.dump(keep);
  }
  const cleaned = piexif.remove(bin);   // 기존 EXIF 블록 제거 후 새로 삽입
  return piexif.insert(bytes, cleaned);
}
</script>

<script>
const $ = id => document.getElementById(id);
let photos = [];      // {file, name, dataUrl, info, sortKey, outBin}
let coord = null;     // {lat,lng,label}
let geocoder = null, places = null;

// ---------- 카카오 SDK ----------
function loadKakao(){
  return new Promise((resolve, reject) => {
    if (window.kakao && kakao.maps && kakao.maps.services) return resolve();
    if (!KAKAO_JS_KEY || KAKAO_JS_KEY.includes('여기에')) return reject(new Error('카카오 키가 입력되지 않았습니다.'));
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&libraries=services&autoload=false`;
    s.onload = () => kakao.maps.load(resolve);
    s.onerror = () => reject(new Error('카카오 지도 불러오기 실패 (키·도메인 등록 확인)'));
    document.head.appendChild(s);
  });
}

async function geocode(addr){
  await loadKakao();
  if (!geocoder) geocoder = new kakao.maps.services.Geocoder();
  if (!places)   places   = new kakao.maps.services.Places();
  const byAddr = await new Promise(r => geocoder.addressSearch(addr, (res, st) =>
    r(st === kakao.maps.services.Status.OK ? res[0] : null)));
  if (byAddr) return { lat: +byAddr.y, lng: +byAddr.x, label: byAddr.address_name };
  const byKw = await new Promise(r => places.keywordSearch(addr, (res, st) =>
    r(st === kakao.maps.services.Status.OK ? res[0] : null)));
  if (byKw) return { lat: +byKw.y, lng: +byKw.x, label: `${byKw.place_name} (${byKw.address_name})` };
  return null;
}

function setStatus(el, msg, cls){ el.textContent = msg; el.className = 'status' + (cls ? ' ' + cls : ''); }

$('btnGeo').onclick = async () => {
  const addr = $('addr').value.trim();
  coord = null;
  if (!addr) { setStatus($('geoStatus'), '주소가 비어 있어 위치정보가 삭제됩니다.', 'warn'); return; }
  setStatus($('geoStatus'), '검색 중…');
  try {
    const c = await geocode(addr);
    if (!c) { setStatus($('geoStatus'), '주소를 찾지 못했습니다. 지번 또는 도로명으로 다시 입력해 주세요.', 'err'); return; }
    coord = { ...c, addr };
    $('geoStatus').className = 'status ok';
    $('geoStatus').innerHTML = `✔ ${c.label}<br>${c.lat.toFixed(6)}, ${c.lng.toFixed(6)} · ` +
      `<a href="https://map.kakao.com/link/map/${encodeURIComponent(c.label)},${c.lat},${c.lng}" target="_blank" rel="noopener">지도에서 확인</a>`;
  } catch(e) { setStatus($('geoStatus'), e.message, 'err'); }
};
$('addr').addEventListener('input', () => { coord = null; setStatus($('geoStatus'), ''); });

// ---------- 사진 불러오기 ----------
function readDataUrl(file){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
}

$('files').onchange = async e => {
  const files = [...e.target.files];
  photos = [];
  for (const f of files) {
    if (!/jpe?g$/i.test(f.name) && f.type !== 'image/jpeg') continue;
    const dataUrl = await readDataUrl(f);
    const info = readInfo(loadExif(dataUrl));
    photos.push({ file: f, name: f.name, dataUrl, info, sortKey: (info.dt || '9999') + f.name, outBin: null });
  }
  photos.sort((a,b) => a.sortKey.localeCompare(b.sortKey));
  $('pickText').textContent = photos.length ? `${photos.length}장 선택됨 (다시 누르면 새로 선택)` : '여기를 눌러 사진 선택 (JPG, 여러 장 가능)';
  if (files.length && !photos.length) alert('JPG 사진만 처리할 수 있습니다.');
  $('saveBox').style.display = 'none';
  setStatus($('applyStatus'), '');
  render();
};

function fmtDt(s){ return s ? s.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1-$2-$3') : ''; }

function render(){
  $('list').innerHTML = photos.map((p,i) => {
    const old = `기존: ${p.info.dt ? fmtDt(p.info.dt) : '시간 없음'} · ${p.info.gps ? '위치 있음' : '위치 없음'}`;
    let nw = '';
    if (p.result) nw = `<div class="new">변경: ${p.result.time ? fmtDt(p.result.time) : '시간 삭제'} · ${p.result.coord ? '위치 변경' : '위치 삭제'}<br>→ ${p.outName}</div>`;
    if (p.error) nw = `<div class="bad">실패: ${p.error}</div>`;
    return `<div class="item"><div class="num">${i+1}</div><img src="${p.dataUrl}" alt="">
      <div class="meta"><div class="name">${p.name}</div><div class="old">${old}</div>${nw}</div></div>`;
  }).join('');
  $('btnApply').disabled = !photos.length;
}

// ---------- 적용 ----------
$('btnApply').onclick = async () => {
  const date = $('date').value, ts = $('tStart').value, te = $('tEnd').value;
  const addr = $('addr').value.trim();

  let times = null;
  if (date) {
    if (!ts || !te) return setStatus($('applyStatus'), '시간 구간(시작·종료)을 모두 입력해 주세요.', 'err');
    if (toSec(te) < toSec(ts)) return setStatus($('applyStatus'), '종료시간이 시작시간보다 빠릅니다.', 'err');
    times = randomExifTimes(date, ts, te, photos.length);
  }

  if (addr && (!coord || coord.addr !== addr)) {
    setStatus($('applyStatus'), '주소 확인 중…');
    try {
      const c = await geocode(addr);
      if (!c) return setStatus($('applyStatus'), '주소를 찾지 못했습니다. [위치 확인]으로 먼저 확인해 주세요.', 'err');
      coord = { ...c, addr };
    } catch(e) { return setStatus($('applyStatus'), e.message, 'err'); }
  }
  const useCoord = addr ? { lat: coord.lat, lng: coord.lng } : null;
  const stripAll = $('stripAll').checked;

  let ok = 0;
  const usedNames = new Set();
  photos.forEach((p, i) => {
    p.error = null; p.result = null; p.outBin = null; p.outName = null;
    try {
      p.outBin = applyToImage(p.dataUrl, { time: times ? times[i] : null, coord: useCoord, stripAll });
      p.result = { time: times ? times[i] : null, coord: useCoord };
      p.outName = makeName(p.result.time, p.name, usedNames);
      ok++;
    } catch(e) { p.error = e.message || '처리 오류'; }
  });
  render();
  setStatus($('applyStatus'), `${ok}장 적용 완료${ok < photos.length ? `, ${photos.length-ok}장 실패` : ''}. 아래에서 저장해 주세요.`, ok ? 'ok' : 'err');
  $('saveBox').style.display = ok ? 'flex' : 'none';
};

// ---------- 저장 ----------
function toBlob(bin){
  const s = bin.startsWith('data:') ? atob(bin.split(',')[1]) : bin;
  const u = new Uint8Array(s.length);
  for (let i=0;i<s.length;i++) u[i] = s.charCodeAt(i) & 0xff;
  return new Blob([u], { type: 'image/jpeg' });
}
// 새 시간 → "20261103_075928.jpg" (시간 삭제 시 원래 파일명 유지, 같은 이름은 _1, _2 붙임)
function makeName(time, original, used){
  let base = time ? time.replace(/:/g, '').replace(' ', '_') : original.replace(/\.[^.]+$/, '');
  let name = base + '.jpg', k = 1;
  while (used.has(name)) name = `${base}_${k++}.jpg`;
  used.add(name);
  return name;
}
function outFiles(){
  return photos.filter(p => p.outBin).map(p => new File([toBlob(p.outBin)], p.outName || p.name, { type: 'image/jpeg' }));
}

$('btnSave').onclick = async () => {
  const files = outFiles();
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    await new Promise(r => setTimeout(r, 400));
  }
  setStatus($('applyStatus'), `${files.length}장 저장했습니다. (다운로드 폴더)`, 'ok');
};

$('btnShare').onclick = async () => {
  const files = outFiles();
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch(e) {}
  } else {
    alert('이 브라우저는 파일 공유를 지원하지 않습니다. [전체 저장]을 이용해 주세요.');
  }
};
</script>
</body>
